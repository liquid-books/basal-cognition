# MyST project configuration
# Docs: https://mystmd.org/guide/configuration
version: 1
project:
  title: "Basal Cognition"
  subtitle: "How Intelligence Works Without a Brain — and What That Means for Machines"
  authors:
    - name: Dr. Ernesto Lee
    - name: Madison Lee
  description: |
    Cells navigate. Wounds close in the right shape. Slime mold solves mazes.
    Nobody taught them how. Basal Cognition is a plain-language field guide to
    intelligence that runs without a brain — and a working blueprint for testing
    whether our AI systems have it too.
  keywords:
    - basal cognition
    - TAME
    - Michael Levin
    - diverse intelligence
    - morphogenesis
    - bioelectricity
    - cognitive light cone
    - habituation
    - AI agents
    - multi-scale competency
  license: CC-BY-4.0
  open_access: true
  github: https://github.com/liquid-books/basal-cognition
